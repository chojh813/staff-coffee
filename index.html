<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>원두 사용량 대시보드</title>
<meta name="description" content="원두·2차가공품 입출고, 재고, 사용처별 사용량을 기록하고 한눈에 보는 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F1E7;
  --surface:#FFFFFF;
  --surface-2:#FBF6EE;
  --ink:#241A13;
  --ink-2:#6E5C4C;
  --ink-muted:#9C8C7C;
  --border:#E7DBC7;
  --accent:#93502C;
  --accent-ink:#FFFFFF;
  --accent-soft:#F1DFC7;
  --chart-surface:#fcfcfb;
  --grid:#e1e0d9;
  --baseline:#c3c2b7;
  --txt-primary:#0b0b0b;
  --txt-secondary:#52514e;
  --txt-muted:#898781;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --series-3:#1baf7a;
  --series-4:#eda100;
  --series-5:#e87ba4;
  --good:#0ca30c;
  --warn:#b5680a;
  --shadow: 0 1px 2px rgba(36,26,19,0.06), 0 8px 24px rgba(36,26,19,0.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120D;
    --surface:#221A13;
    --surface-2:#2A2118;
    --ink:#F5ECE0;
    --ink-2:#CBB9A6;
    --ink-muted:#8F7C6A;
    --border:#3B2E22;
    --accent:#E0996A;
    --accent-ink:#1A1208;
    --accent-soft:#3C2C1C;
    --chart-surface:#1a1a19;
    --grid:#2c2c2a;
    --baseline:#383835;
    --txt-primary:#ffffff;
    --txt-secondary:#c3c2b7;
    --txt-muted:#898781;
    --series-1:#3987e5;
    --series-2:#d95926;
    --series-3:#199e70;
    --series-4:#c98500;
    --series-5:#d55181;
    --good:#0ca30c;
    --warn:#e0a333;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120D;
  --surface:#221A13;
  --surface-2:#2A2118;
  --ink:#F5ECE0;
  --ink-2:#CBB9A6;
  --ink-muted:#8F7C6A;
  --border:#3B2E22;
  --accent:#E0996A;
  --accent-ink:#1A1208;
  --accent-soft:#3C2C1C;
  --chart-surface:#1a1a19;
  --grid:#2c2c2a;
  --baseline:#383835;
  --txt-primary:#ffffff;
  --txt-secondary:#c3c2b7;
  --txt-muted:#898781;
  --series-1:#3987e5;
  --series-2:#d95926;
  --series-3:#199e70;
  --series-4:#c98500;
  --series-5:#d55181;
  --good:#0ca30c;
  --warn:#e0a333;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR', system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:1180px;margin:0 auto;padding:0 20px 48px;}

/* ---- header ---- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
  padding:18px 0 14px;
  background:linear-gradient(var(--bg) 82%, transparent);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent); color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-size:22px; flex-shrink:0;
  box-shadow:var(--shadow);
}
.brand h1{margin:0; font-size:19px; font-weight:900; letter-spacing:-0.01em;}
.brand .period{margin:2px 0 0; font-size:12.5px; color:var(--ink-muted); font-weight:500;}
.maintabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:11px; border:1px solid var(--border);}
.tab-btn{
  appearance:none; border:none; background:transparent; cursor:pointer;
  padding:8px 16px; border-radius:8px; font:inherit; font-weight:700; font-size:13.5px;
  color:var(--ink-2); transition:background .15s, color .15s;
}
.tab-btn.active{background:var(--accent); color:var(--accent-ink);}
.tab-btn:not(.active):hover{background:var(--accent-soft); color:var(--ink);}
.topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.btn-export{
  appearance:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  padding:9px 16px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-2); font:inherit; font-weight:700; font-size:13px;
  box-shadow:var(--shadow); white-space:nowrap; transition:background .15s, color .15s, border-color .15s;
}
.btn-export svg{width:14px; height:14px; flex-shrink:0;}
.btn-export:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
.btn-export:disabled{opacity:.55; cursor:progress;}
.btn-export-sm{padding:8px 13px; font-size:12.5px;}

.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---- toolbar / segmented control ---- */
.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:4px 0 18px;}
.segmented{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; box-shadow:var(--shadow);}
.seg-btn{
  appearance:none; border:none; background:transparent; cursor:pointer;
  padding:7px 14px; border-radius:7px; font:inherit; font-weight:700; font-size:13px;
  color:var(--ink-2);
}
.seg-btn.active{background:var(--accent); color:var(--accent-ink);}

#searchBox{
  font:inherit; font-size:13.5px; padding:9px 14px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  min-width:200px; flex:0 1 260px;
}
#searchBox::placeholder{color:var(--ink-muted);}
#searchBox:focus{outline:2px solid var(--accent); outline-offset:1px;}

/* ---- stat tiles ---- */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-bottom:20px;}
.stat-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; box-shadow:var(--shadow);
}
.stat-tile .label{font-size:12.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}
.stat-tile .value{
  font-family:'Fraunces', 'Noto Sans KR', serif; font-optical-sizing:auto;
  font-size:32px; font-weight:700; margin-top:6px; letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums;
}
.stat-tile .value .unit{font-size:15px; font-weight:600; color:var(--ink-2); margin-left:4px;}
.stat-tile.accent{background:var(--accent); color:var(--accent-ink);}
.stat-tile.accent .label{color:color-mix(in srgb, var(--accent-ink) 75%, transparent);}
.stat-tile.accent .value .unit{color:color-mix(in srgb, var(--accent-ink) 80%, transparent);}

/* ---- chart cards ---- */
.chart-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:14px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px 14px; box-shadow:var(--shadow);
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.card-head h2{margin:0; font-size:14.5px; font-weight:700;}
.chart-wrap{width:100%;}
.chart-wrap svg{width:100%; height:auto; display:block; overflow:visible;}

.legend{display:flex; flex-wrap:wrap; gap:10px 14px;}
.legend-item{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--txt-secondary); font-weight:600;}
.legend-swatch{width:9px; height:9px; border-radius:2.5px; flex-shrink:0;}
.legend-line{width:14px; height:0; border-top:2px dashed var(--txt-secondary);}

.axis-label, .tick-label{font-size:9.5px; fill:var(--txt-muted); font-family:'Noto Sans KR',sans-serif;}
.val-label{font-size:9.5px; fill:var(--txt-secondary); font-weight:700; font-family:'Noto Sans KR',sans-serif;}

/* ---- tooltip ---- */
#tooltip{
  position:fixed; pointer-events:none; z-index:999;
  background:var(--ink); color:var(--bg);
  padding:8px 11px; border-radius:9px; font-size:12px; line-height:1.5;
  box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; transform:translate(-9999px,-9999px);
  transition:opacity .08s ease; max-width:220px;
}
#tooltip .tt-row{display:flex; align-items:center; gap:6px; white-space:nowrap;}
#tooltip .tt-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
#tooltip .tt-title{font-weight:800; margin-bottom:4px;}

/* ---- detail tables ---- */
.subtabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.subtab-btn{
  appearance:none; border:1px solid var(--border); background:var(--surface); cursor:pointer;
  padding:8px 14px; border-radius:9px; font:inherit; font-weight:700; font-size:13px; color:var(--ink-2);
}
.subtab-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

.detail-panel{display:none;}
.detail-panel.active{display:block;}

.table-wrap{
  border:1px solid var(--border); border-radius:14px; overflow:auto;
  background:var(--surface); box-shadow:var(--shadow);
}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
thead th{
  position:sticky; top:0; background:var(--surface-2); text-align:left;
  padding:10px 12px; font-weight:700; font-size:11.5px; color:var(--ink-2);
  text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:8px 12px; border-bottom:1px solid var(--border); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
tbody tr.new-row td{animation:flashNew 1.6s ease-out;}
@keyframes flashNew{ 0%{background:var(--accent-soft);} 100%{background:transparent;} }
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.pill.in{background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good);}
.pill.out{background:var(--accent-soft); color:var(--accent);}
.dim{color:var(--ink-muted);}
.num{text-align:right; font-weight:600;}
.empty-row td{text-align:center; color:var(--ink-muted); padding:26px; font-style:normal;}

.summary-grid{display:grid; grid-template-columns:2fr 1fr; gap:14px;}
.summary-card table{min-width:0;}
.summary-card h3{margin:0 0 10px; font-size:13.5px; font-weight:700;}
@media (max-width:900px){
  .summary-grid{grid-template-columns:1fr;}
}
.bar-cell{display:flex; align-items:center; gap:8px; min-width:140px;}
.bar-track{flex:1; height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; min-width:60px;}
.bar-fill{height:100%; border-radius:4px;}

.foot{margin-top:28px; padding-top:16px; border-top:1px solid var(--border);}
.foot p{margin:0; font-size:11.5px; color:var(--ink-muted); line-height:1.6;}

/* ---- add-record form ---- */
.form-card{margin-bottom:14px;}
.form-card .card-head{margin-bottom:12px;}
.sync-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--border);
}
.sync-badge .dot{width:6px;height:6px;border-radius:50%; background:var(--txt-muted); flex-shrink:0;}
.sync-badge.live .dot{background:var(--good);}
.sync-badge.local .dot{background:var(--warn);}
.type-toggle{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.type-btn{
  appearance:none; border:none; cursor:pointer; padding:9px 20px; font:inherit; font-weight:800; font-size:13.5px;
  background:var(--surface); color:var(--ink-2);
}
.type-btn.active[data-type="입고"]{background:color-mix(in srgb, var(--good) 18%, var(--surface)); color:var(--good);}
.type-btn.active[data-type="사용"]{background:var(--accent-soft); color:var(--accent);}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px 12px; margin-top:12px;}
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field label{font-size:11.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
.field input, .field select{
  font:inherit; font-size:13.5px; padding:9px 11px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink); width:100%;
}
.field input:disabled, .field select:disabled{opacity:.5; cursor:not-allowed;}
.field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.field .hint{font-size:11px; color:var(--ink-muted); min-height:14px;}
.field .hint.warn{color:var(--warn); font-weight:700;}
.field .hint.ok{color:var(--good); font-weight:700;}
.form-actions{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;}
.btn-primary{
  appearance:none; border:none; cursor:pointer; padding:10px 22px; border-radius:9px;
  background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:800; font-size:13.5px;
  box-shadow:var(--shadow);
}
.btn-primary:disabled{opacity:.55; cursor:progress;}
.btn-primary:not(:disabled):hover{filter:brightness(1.06);}
.btn-ghost{
  appearance:none; cursor:pointer; padding:9px 16px; border-radius:9px;
  background:transparent; border:1px solid var(--border); color:var(--ink-2); font:inherit; font-weight:700; font-size:13px;
}
.btn-ghost:hover{background:var(--surface-2);}
.form-card.editing{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow);}
.form-msg{font-size:12.5px; font-weight:700; min-height:16px;}
.form-msg.ok{color:var(--good);}
.form-msg.err{color:#c0392b;}

/* ---- row actions ---- */
.row-actions{display:flex; gap:6px; white-space:nowrap;}
.row-btn{
  appearance:none; cursor:pointer; border:1px solid var(--border); background:var(--surface);
  border-radius:7px; padding:4px 10px; font:inherit; font-size:11.5px; font-weight:700; color:var(--ink-2);
}
.row-btn:hover{background:var(--surface-2);}
.row-btn.danger{color:#c0392b; border-color:color-mix(in srgb, #c0392b 35%, var(--border));}
.row-btn.danger:hover{background:color-mix(in srgb, #c0392b 10%, transparent);}
tbody tr.editing-row td{background:var(--accent-soft);}

/* ---- stock tab toolbar ---- */
.stock-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.checkbox-label{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ink-2); cursor:pointer; user-select:none;}
.checkbox-label input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}
.stock-hint{font-size:11.5px; color:var(--ink-muted);}
th.sortable{cursor:pointer; user-select:none;}
th.sortable:hover{color:var(--ink);}
th.sortable .sort-arrow{margin-left:4px; opacity:.7;}

@media (max-width:640px){
  .brand h1{font-size:16.5px;}
  .stat-tile .value{font-size:26px;}
  table{min-width:560px;}
}
</style>

<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">☕</span>
      <div>
        <h1>원두 · 2차가공품 재고 관리</h1>
        <p class="period">직접 입력한 입출고 기록 기준 · 실시간 집계</p>
      </div>
    </div>
    <div class="topbar-right">
      <nav class="maintabs" role="tablist">
        <button class="tab-btn active" data-tab="dashboard" type="button">대시보드</button>
        <button class="tab-btn" data-tab="detail" type="button">상세 데이터</button>
      </nav>
      <button type="button" class="btn-export" id="btnExportExcel" title="원두·2차가공품의 입출고 기록·잔여재고(전체/재고있음만)·사용량 요약을 엑셀 파일로 내려받습니다">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 1.5v8.25M8 9.75 5 6.75M8 9.75l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11v1.75c0 .69.56 1.25 1.25 1.25h8.5c.69 0 1.25-.56 1.25-1.25V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        엑셀 다운로드
      </button>
    </div>
  </header>

  <main>
    <section id="tab-dashboard" class="tabpanel active">
      <div class="toolbar">
        <div class="segmented" data-group="material">
          <button class="seg-btn active" data-material="bean" type="button">원두 (g)</button>
          <button class="seg-btn" data-material="capsule" type="button">2차가공품 (ea)</button>
        </div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="chart-grid">
        <div class="card chart-card">
          <div class="card-head">
            <h2>월별 사용처별 사용량 · 총 입고량</h2>
            <div class="legend" id="legendUsage"></div>
          </div>
          <div class="chart-wrap"><svg id="chartCombo" viewBox="0 0 640 300"></svg></div>
        </div>
        <div class="card chart-card">
          <div class="card-head"><h2>월말 재고 추이</h2></div>
          <div class="chart-wrap"><svg id="chartStock" viewBox="0 0 640 300"></svg></div>
        </div>
        <div class="card chart-card">
          <div class="card-head"><h2>사용처별 누적 사용량 비중</h2></div>
          <div class="chart-wrap"><svg id="chartLoc" viewBox="0 0 640 240"></svg></div>
        </div>
        <div class="card chart-card">
          <div class="card-head"><h2>품목별 사용량 순위</h2></div>
          <div class="chart-wrap"><svg id="chartItems" viewBox="0 0 640 240"></svg></div>
        </div>
      </div>
    </section>

    <section id="tab-detail" class="tabpanel">
      <nav class="subtabs">
        <button class="subtab-btn active" data-subtab="records" type="button">입출고 기록</button>
        <button class="subtab-btn" data-subtab="stock" type="button">품목·제조일자별 잔여재고</button>
        <button class="subtab-btn" data-subtab="summary" type="button">사용량 요약</button>
      </nav>
      <div class="toolbar">
        <div class="segmented" data-group="material2">
          <button class="seg-btn active" data-material="bean" type="button">원두</button>
          <button class="seg-btn" data-material="capsule" type="button">2차가공품</button>
        </div>
        <input type="search" id="searchBox" placeholder="품목명으로 검색...">
        <button type="button" class="btn-export btn-export-sm" id="btnExportView" title="지금 화면에 보이는 목록(검색어·정렬·재고 필터가 적용된 상태) 그대로 엑셀로 내려받습니다">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 1.5v8.25M8 9.75 5 6.75M8 9.75l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11v1.75c0 .69.56 1.25 1.25 1.25h8.5c.69 0 1.25-.56 1.25-1.25V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          현재 목록 다운로드

const el = (tag, attrs={}, parent=null) => {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const niceMax = (v) => {
  if (v <= 0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let step;
  if (norm <= 1) step = 1;
  else if (norm <= 2) step = 2;
  else if (norm <= 5) step = 5;
  else step = 10;
  return step * mag;
};

/* ================= DATA LAYER ================= */
/* `records` is the single source of truth: every stat, chart and table
   below is derived from it live, so a newly saved entry updates
   everything automatically. */
let records = SEED_RECORDS.slice();

function computeMonths(recs){
  const set = new Set(recs.map(r => r.date.slice(0,7)));
  const arr = [...set].sort();
  return arr.length ? arr : [new Date().toISOString().slice(0,7)];
}
function computeStats(recs){
  const total_in = recs.filter(r=>r.type==='입고').reduce((s,r)=>s+r.qty,0);
  const total_used = recs.filter(r=>r.type==='사용').reduce((s,r)=>s+r.qty,0);
  return {total_in, total_used, total_stock: total_in - total_used};
}
function computeMonthly(recs, months){
  const monthly_in = months.map(m => recs.filter(r=>r.type==='입고' && r.date.slice(0,7)===m).reduce((s,r)=>s+r.qty,0));
  const monthly_usage_by_loc = {};
  LOCS.forEach(loc => {
    monthly_usage_by_loc[loc] = months.map(m => recs.filter(r=>r.type==='사용' && r.loc===loc && r.date.slice(0,7)===m).reduce((s,r)=>s+r.qty,0));
  });
  const monthly_stock_eom = months.map(m => {
    const cumIn = recs.filter(r=>r.type==='입고' && r.date.slice(0,7)<=m).reduce((s,r)=>s+r.qty,0);
    const cumUsed = recs.filter(r=>r.type==='사용' && r.date.slice(0,7)<=m).reduce((s,r)=>s+r.qty,0);
    return cumIn - cumUsed;
  });
  return {monthly_in, monthly_usage_by_loc, monthly_stock_eom};
}
function computeItemsUsage(recs){
  const map = new Map();
  const ensure = (name) => {
    if(!map.has(name)){ const o={name,total:0}; LOCS.forEach(l=>o[l]=0); map.set(name,o); }
    return map.get(name);
  };
  recs.forEach(r => ensure(r.item));
  recs.filter(r=>r.type==='사용').forEach(r => {
    const o = ensure(r.item);
    o.total += r.qty;
    if (LOCS.includes(r.loc)) o[r.loc] += r.qty;
  });
  return [...map.values()];
}
function computeLocSummary(recs){
  const usageRecs = recs.filter(r=>r.type==='사용' && LOCS.includes(r.loc));
  const totalRaw = usageRecs.reduce((s,r)=>s+r.qty,0);
  const total = totalRaw || 1;
  return LOCS.map(loc => {
    const qty = usageRecs.filter(r=>r.loc===loc).reduce((s,r)=>s+r.qty,0);
    return {loc, qty, pct: Math.round((qty/total)*1000)/10};
  });
}
/* 제조일자/배치 구분 없이, 품목코드 하나로 합친 전체 입고·사용·잔여재고 */
function computeStockByCode(recs){
  const map = new Map();
  recs.forEach(r => {
    const key = r.code ? r.code : ('__noc__' + r.item);
    if(!map.has(key)) map.set(key, {code:r.code||'', item:r.item, in:0, used:0});
    const g = map.get(key);
    if (r.type === '입고') g.in += r.qty; else g.used += r.qty;
    if (!g.code && r.code) g.code = r.code;
    if (r.item) g.item = r.item;
  });
  return [...map.values()]
    .map(g => ({...g, remain: g.in - g.used}))
    .sort((a,b) => a.item.localeCompare(b.item, 'ko'));
}
function computeStockRows(recs){
  const map = new Map();
  recs.forEach(r => {
    const key = r.item + '||' + r.batch;
    if(!map.has(key)) map.set(key, {code:r.code||'', item:r.item, batch:r.batch, in:0, used:0});
    const g = map.get(key);
    if (r.type === '입고') g.in += r.qty; else g.used += r.qty;
    if (r.code) g.code = r.code;
  });
  return [...map.values()].map(g => ({...g, remain: g.in - g.used}));
}
function computeRunningStock(recs){
  const byKey = new Map();
  const sorted = [...recs].sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)));
  return sorted.map(r => {
    const key = r.item + '||' + r.batch;
    const prev = byKey.get(key) || 0;
    const next = r.type === '입고' ? prev + r.qty : prev - r.qty;
    byKey.set(key, next);
    return {...r, stockAfter: next};
  });
}
function deriveMaterialData(material){
  const recs = records.filter(r => r.material === material);
  const months = computeMonths(recs);
  const stats = computeStats(recs);
  const monthly = computeMonthly(recs, months);
  return {
    recs, months, ...stats, ...monthly,
    items_usage: computeItemsUsage(recs),
    loc_summary: computeLocSummary(recs),
    stock_rows: computeStockRows(recs),
    stock_by_code: computeStockByCode(recs),
  };
}

/* 구글 시트가 날짜를 자동 변환해 "2026-10-12T15:00:00.000Z" 같은 값이 와도
   한국 시간 기준 "2026-10-13" 형태로 바꿔서 보여줌 */
function localYMD(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function normDate(v){
  if (v == null || v === '') return '';
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return localYMD(d);
  return s;
}
const tooltip = document.getElementById('tooltip');
function showTooltip(evt, html){
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  const x = evt.clientX, y = evt.clientY;
  const rect = tooltip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + rect.width > window.innerWidth - 8) left = x - rect.width - 14;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - 14;
  tooltip.style.transform = `translate(${left}px, ${top}px)`;
}
function hideTooltip(){ tooltip.style.opacity = '0'; tooltip.style.transform = 'translate(-9999px,-9999px)'; }

/* ---------------- COMBO CHART: stacked usage bars + inflow line ---------------- */
function renderCombo(material, d){
  const svg = document.getElementById('chartCombo');
  svg.innerHTML = '';
  const unit = unitOf(material);
  const months = d.months.map(m => m.slice(2).replace('-','.') + '월');
  const W = 640, H = 300;
  const margin = {top:14, right:14, bottom:28, left:52};
  const plotW = W - margin.left - margin.right;
  const plotH = H - margin.top - margin.bottom;

  const stackTotals = d.months.map((_, i) => LOCS.reduce((s, loc) => s + d.monthly_usage_by_loc[loc][i], 0));
  const maxVal = Math.max(...stackTotals, ...d.monthly_in, 1);
  const yMax = niceMax(maxVal * 1.12);
  const yScale = (v) => plotH - (v / yMax) * plotH;

  const g = el('g', {transform:`translate(${margin.left},${margin.top})`}, svg);

  const ticks = 4;
  for (let i=0;i<=ticks;i++){
    const v = (yMax/ticks)*i;
    const y = yScale(v);
    el('line', {x1:0, x2:plotW, y1:y, y2:y, stroke:'var(--grid)', 'stroke-width':1}, g);
    const t = el('text', {x:-8, y:y+3, 'text-anchor':'end', class:'tick-label'}, g);
    t.textContent = v >= 1000 ? (v/1000).toLocaleString('ko-KR') + 'k' : fmt(v);
  }
  el('line', {x1:0,x2:0,y1:0,y2:plotH, stroke:'var(--baseline)', 'stroke-width':1}, g);
  el('line', {x1:0,x2:plotW,y1:plotH,y2:plotH, stroke:'var(--baseline)', 'stroke-width':1}, g);

  const bandW = plotW / months.length;
  const barW = Math.min(bandW * 0.42, 64);

  months.forEach((mLabel, i) => {
    const cx = bandW*i + bandW/2;
    let yCursor = plotH;
    LOCS.forEach(loc => {
      const v = d.monthly_usage_by_loc[loc][i];
      if (v <= 0) return;
      const h = (v/yMax)*plotH;
      const rect = el('rect', {
        x:cx-barW/2, y:yCursor-h, width:barW, height:h,
        fill:LOC_COLOR[loc], rx:2
      }, g);
      rect.style.cursor='pointer';
      rect.addEventListener('mousemove', (evt) => {
        const rows = LOCS.map(l => {
          const vv = d.monthly_usage_by_loc[l][i];
          return `<div class="tt-row"><span class="tt-dot" style="background:${LOC_COLOR[l]}"></span>${l}: ${fmt(vv)}${unit}</div>`;
        }).join('');
        showTooltip(evt, `<div class="tt-title">${d.months[i]}</div>${rows}<div class="tt-row" style="margin-top:4px;opacity:.85">총 입고량: ${fmt(d.monthly_in[i])}${unit}</div>`);
      });
      rect.addEventListener('mouseleave', hideTooltip);
      yCursor -= h;
    });
    const t = el('text', {x:cx, y:plotH+18, 'text-anchor':'middle', class:'axis-label'}, g);
    t.textContent = mLabel;
  });

  const pts = months.map((_, i) => [bandW*i + bandW/2, yScale(d.monthly_in[i])]);
  const pathD = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  el('path', {d:pathD, fill:'none', stroke:'var(--txt-secondary)', 'stroke-width':2, 'stroke-dasharray':'5 4'}, g);
  pts.forEach((p,i) => {
    const c = el('circle', {cx:p[0], cy:p[1], r:4, fill:'var(--chart-surface)', stroke:'var(--txt-secondary)', 'stroke-width':2}, g);
    c.style.cursor='pointer';
    c.addEventListener('mousemove', (evt) => showTooltip(evt, `<div class="tt-title">${d.months[i]} 입고</div><div class="tt-row">${fmt(d.monthly_in[i])}${unit}</div>`));
    c.addEventListener('mouseleave', hideTooltip);
  });
}

/* ---------------- STOCK AREA/LINE CHART ---------------- */
function renderStock(material, d){
  const svg = document.getElementById('chartStock');
  svg.innerHTML = '';
  const unit = unitOf(material);
  const months = d.months.map(m => m.slice(2).replace('-','.') + '월');
  const W=640, H=300;
  const margin={top:14,right:14,bottom:28,left:52};
  const plotW=W-margin.left-margin.right, plotH=H-margin.top-margin.bottom;
  const maxVal = Math.max(...d.monthly_stock_eom, 1);
  const yMax = niceMax(maxVal*1.15);
  const yScale = (v) => plotH - (v/yMax)*plotH;
  const g = el('g', {transform:`translate(${margin.left},${margin.top})`}, svg);

  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const v=(yMax/ticks)*i, y=yScale(v);
    el('line', {x1:0,x2:plotW,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}, g);
    const t = el('text', {x:-8,y:y+3,'text-anchor':'end',class:'tick-label'}, g);
    t.textContent = v>=1000 ? (v/1000).toLocaleString('ko-KR')+'k' : fmt(v);
  }
  el('line', {x1:0,x2:0,y1:0,y2:plotH, stroke:'var(--baseline)','stroke-width':1}, g);
  el('line', {x1:0,x2:plotW,y1:plotH,y2:plotH, stroke:'var(--baseline)','stroke-width':1}, g);

  const bandW = plotW/months.length;
  const pts = months.map((_,i) => [bandW*i+bandW/2, yScale(d.monthly_stock_eom[i])]);

  const areaD = 'M' + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L') + ` L${pts[pts.length-1][0]},${plotH} L${pts[0][0]},${plotH} Z`;
  el('path', {d:areaD, fill:'var(--accent)', opacity:'0.14'}, g);
  const lineD = 'M' + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  el('path', {d:lineD, fill:'none', stroke:'var(--accent)', 'stroke-width':2.5}, g);

  months.forEach((mLabel,i)=>{
    const t = el('text', {x:bandW*i+bandW/2, y:plotH+18, 'text-anchor':'middle', class:'axis-label'}, g);
    t.textContent = mLabel;
    const c = el('circle', {cx:pts[i][0], cy:pts[i][1], r:4.5, fill:'var(--accent)', stroke:'var(--chart-surface)', 'stroke-width':2}, g);
    c.style.cursor='pointer';
    c.addEventListener('mousemove', (evt) => showTooltip(evt, `<div class="tt-title">${d.months[i]} 월말 재고</div><div class="tt-row">${fmt(d.monthly_stock_eom[i])}${unit}</div>`));
    c.addEventListener('mouseleave', hideTooltip);
  });
}

/* ---------------- LOCATION SHARE HBAR ---------------- */
function renderLocChart(material, d){
  const svg = document.getElementById('chartLoc');
  svg.innerHTML = '';
  const unit = unitOf(material);
  const items = d.loc_summary;
  const W=640, H = 44*items.length + 20;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const margin={top:6,right:52,bottom:6,left:96};
  const plotW = W - margin.left - margin.right;
  const maxV = Math.max(...items.map(x=>x.qty), 1);
  const rowH = (H - margin.top - margin.bottom)/items.length;
  const g = el('g', {transform:`translate(${margin.left},${margin.top})`}, svg);

  items.forEach((it, i) => {
    const y = i*rowH + rowH*0.22;
    const bh = rowH*0.56;
    const w = (it.qty/maxV)*plotW;
    el('rect', {x:0,y:y,width:plotW,height:bh, fill:'var(--grid)', rx:4}, g);
    const bar = el('rect', {x:0,y:y,width:Math.max(w,it.qty>0?3:0),height:bh, fill:LOC_COLOR[it.loc], rx:4}, g);
    bar.style.cursor='pointer';
    bar.addEventListener('mousemove', (evt) => showTooltip(evt, `<div class="tt-title">${it.loc}</div><div class="tt-row"><span class="tt-dot" style="background:${LOC_COLOR[it.loc]}"></span>${fmt(it.qty)}${unit} (${it.pct}%)</div>`));
    bar.addEventListener('mouseleave', hideTooltip);
    const lbl = el('text', {x:-8, y:y+bh/2+4, 'text-anchor':'end', class:'axis-label'}, g);
    lbl.textContent = it.loc;
    const val = el('text', {x:plotW+8, y:y+bh/2+4, 'text-anchor':'start', class:'val-label'}, g);
    val.textContent = `${fmt(it.qty)}${unit} (${it.pct}%)`;
  });
}

/* ---------------- ITEM RANK HBAR ---------------- */
function renderItemsChart(material, d){
  const svg = document.getElementById('chartItems');
  svg.innerHTML = '';
  const unit = unitOf(material);
  const items = [...d.items_usage].sort((a,b) => b.total - a.total);
  const W=640, H = Math.max(40*items.length, 40) + 16;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const margin={top:6,right:56,bottom:6,left:150};
  const plotW = W - margin.left - margin.right;
  const maxV = Math.max(...items.map(x=>x.total), 1);
  const rowH = (H - margin.top - margin.bottom)/Math.max(items.length,1);
  const g = el('g', {transform:`translate(${margin.left},${margin.top})`}, svg);

  items.forEach((it, i) => {
    const y = i*rowH + rowH*0.24;
    const bh = rowH*0.52;
    const w = (it.total/maxV)*plotW;
    el('rect', {x:0,y:y,width:plotW,height:bh, fill:'var(--grid)', rx:4}, g);
    const bar = el('rect', {x:0,y:y,width:Math.max(w,it.total>0?3:0),height:bh, fill:'var(--accent)', rx:4}, g);
    bar.style.cursor='pointer';
    bar.addEventListener('mousemove', (evt) => {
      const rows = LOCS.map(l => `<div class="tt-row"><span class="tt-dot" style="background:${LOC_COLOR[l]}"></span>${l}: ${fmt(it[l]||0)}${unit}</div>`).join('');
      showTooltip(evt, `<div class="tt-title">${it.name} — 합계 ${fmt(it.total)}${unit}</div>${rows}`);
    });
    bar.addEventListener('mouseleave', hideTooltip);
    const lbl = el('text', {x:-8, y:y+bh/2+4, 'text-anchor':'end', class:'axis-label'}, g);
    lbl.textContent = it.name.length > 16 ? it.name.slice(0,15)+'…' : it.name;
    const val = el('text', {x:plotW+8, y:y+bh/2+4, 'text-anchor':'start', class:'val-label'}, g);
    val.textContent = `${fmt(it.total)}${unit}`;
  });
}

let stockHideZero = true;
let stockSortDir = null; // null = original order, 'asc' | 'desc' by 제조일자/소비기한

function renderStockTable(){
  const d = deriveMaterialData(detailMaterial);
  let filtered = d.stock_rows.filter(r => !searchTerm || r.item.toLowerCase().includes(searchTerm));
  if (stockHideZero) filtered = filtered.filter(r => (r.remain||0) > 0);
  if (stockSortDir){
    filtered = [...filtered].sort((a,b) => {
      const cmp = (a.batch||'').localeCompare(b.batch||'');
      return stockSortDir === 'asc' ? cmp : -cmp;
    });
  }
  const dateCol = detailMaterial === 'bean' ? '제조일자' : '소비기한';
  const unit = unitOf(detailMaterial);
  const arrow = stockSortDir ? `<span class="sort-arrow">${stockSortDir === 'asc' ? '▲' : '▼'}</span>` : '';
  let html = `<table><thead><tr>
    <th>품목코드</th><th>품목</th><th class="sortable" data-sort="batch">${dateCol}${arrow}</th><th class="num">입고량(${unit})</th><th class="num">사용량(${unit})</th><th class="num">잔여재고(${unit})</th>
  </tr></thead><tbody>`;
  if (filtered.length === 0){
    html += `<tr class="empty-row"><td colspan="6">${stockHideZero ? '재고가 남아있는 항목이 없습니다.' : '검색 결과가 없습니다.'}</td></tr>`;
  } else {
    filtered.forEach(r => {
      const remain = r.remain||0;
      html += `<tr${remain<=0?' style="color:var(--ink-muted)"':''}>
        <td class="dim">${r.code||''}</td>
        <td>${r.item||''}</td>
        <td>${r.batch||''}</td>

    });

  document.getElementById('tblStock').innerHTML = html;
}

function renderDetail(opts){
  renderRecordsTable();
  renderStockTable();
  renderSummary();
  /* refreshFormContext() rebuilds the item/batch <datalist> options, which
     can reset an in-progress keystroke in Chromium if it runs while that
     input has focus. Only rebuild it on deliberate context changes (initial
     load, material switch, form reset) — never on a background re-render
     triggered by a live db update, so typing in the form is never
     interrupted by someone else's (or our own periodic) data sync. */
  if (opts && opts.refreshForm) refreshFormContext();
  fitTableWraps();
}

/* ---------------- FULL-HEIGHT TABLE SIZING ---------------- */
function fitTableWraps(){
  if (!document.getElementById('tab-detail').classList.contains('active')) return;
  const activePanel = document.querySelector('.detail-panel.active');
  if (!activePanel || activePanel.dataset.panel === 'summary') return;
  const wrap = activePanel.querySelector('.table-wrap');
  if (!wrap) return;
  wrap.style.height = '0px';
  requestAnimationFrame(() => {
    const top = wrap.getBoundingClientRect().top;
    const h = Math.max(240, Math.round(window.innerHeight - top - 20));
    wrap.style.height = h + 'px';
  });
}
window.addEventListener('resize', fitTableWraps);
window.addEventListener('orientationchange', fitTableWraps);

async function deleteRecordById(id){
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  const label = `${rec.date} · ${rec.type} · ${rec.item} (${fmt(rec.qty)}${unitOf(rec.material)})`;
  if (!window.confirm(`다음 기록을 삭제할까요?\n\n${label}\n\n삭제하면 되돌릴 수 없습니다.`)) return;
  try{
    if (usingSheetSync){
      await postToSheet({action:'delete', id});
      await fetchRecordsFromSheet(false);
    } else {
      records = records.filter(r => r.id !== id);
      renderDashboard();
      renderDetail();
    }
    if (editingId === id) resetFormToAdd();
  } catch(e){
    console.error(e);
    window.alert((e && e.message) ? e.message : '삭제에 실패했습니다. 다시 시도해주세요.');
  }
}

function itemNamesFor(material){
  return [...new Set(records.filter(r=>r.material===material).map(r=>r.item))].sort((a,b)=>a.localeCompare(b,'ko'));
}
function batchesForItem(material, itemName, excludeId){
  const map = new Map();
  records.filter(r=>r.material===material && r.item===itemName && r.id!==excludeId).forEach(r => {
    if(!map.has(r.batch)) map.set(r.batch, {batch:r.batch, code:r.code, in:0, used:0});
    const g = map.get(r.batch);
    if (r.type==='입고') g.in += r.qty; else g.used += r.qty;
    if (r.code) g.code = r.code;
  });
  return [...map.values()].map(g=>({...g, remain:g.in-g.used}));
}

function refreshFormContext(){
  if (!editingId){
    formTitle.textContent = '새 기록 추가 — ' + (detailMaterial==='bean' ? '원두' : '2차가공품');
  }
  fBatchLabel.textContent = detailMaterial==='bean' ? '제조일자' : '소비기한';
  fBatch.placeholder = detailMaterial==='bean' ? '예: 26.09.16' : '예: 27.09.16';
  fQtyUnit.textContent = unitOf(detailMaterial);
  itemList.innerHTML = itemNamesFor(detailMaterial).map(n=>`<option value="${n}">`).join('');
  if (fLoc.options.length <= 1){
    fLoc.innerHTML = '<option value="">선택</option>' + LOCS.map(l=>`<option value="${l}">${l}</option>`).join('');
  }
  updateBatchList();
  updateBatchHint();
}

fItem.addEventListener('input', () => {
  updateBatchList();
  updateBatchHint();
  if (codeAutoFilled){
    const matches = records.filter(r=>r.material===detailMaterial && r.item===fItem.value && r.code);
    fCode.value = matches.length ? matches[matches.length-1].code : '';
  }
});
fBatch.addEventListener('input', updateBatchHint);

function updateBatchList(){
  batchList.innerHTML = batchesForItem(detailMaterial, fItem.value, editingId).map(b=>`<option value="${b.batch}">`).join('');
}
function updateBatchHint(){
  const unit = unitOf(detailMaterial);
  const batches = batchesForItem(detailMaterial, fItem.value, editingId);
  const match = batches.find(b => b.batch === fBatch.value);
  if (!fItem.value || !fBatch.value){
    fBatchHint.textContent = '';
    fBatchHint.className = 'hint';
    return;
  }
  if (!match){
    if (formType === '입고'){
      fBatchHint.textContent = '새 배치로 등록됩니다.';
      fBatchHint.className = 'hint';
    } else {
      fBatchHint.textContent = '일치하는 기존 배치가 없습니다. 입고 기록을 먼저 확인해주세요.';
      fBatchHint.className = 'hint warn';
    }
    return;
  }
  if (formType === '사용'){
    const qty = Number(fQty.value)||0;
    if (qty > match.remain){
      fBatchHint.textContent = `현재 재고 ${fmt(match.remain)}${unit} — 입력한 수량이 재고보다 많습니다.`;
      fBatchHint.className = 'hint warn';
    } else {
      fBatchHint.textContent = `현재 재고 ${fmt(match.remain)}${unit}`;
      fBatchHint.className = 'hint ok';
    }
  } else {
    fBatchHint.textContent = `현재 재고 ${fmt(match.remain)}${unit} (기존 배치에 추가)`;
    fBatchHint.className = 'hint';
  }
}

/* ---------------- SHEET SYNC (Google Apps Script 웹 앱) ---------------- */
/* 구글 시트를 데이터 저장소로 쓰는 실시간(폴링) 동기화. claude.ai 로그인 없이
   누구나 이 링크만 열면 보고/입력할 수 있도록, Claude 전용 db capability 대신
   사장님이 배포한 Apps Script 웹 앱 URL과 통신합니다. */
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyaVZu6Sg4-7HaZUW1Nhh69ibyLlUl1tsRSvR9wEWpcIYGAdcS-4MK9oPZWKz_k3pMj/exec';
const SYNC_POLL_MS = 9000;
let usingSheetSync = false;
let sessionPin = '';
const syncBadge = document.getElementById('syncBadge');
const syncBadgeText = document.getElementById('syncBadgeText');
function setSyncBadge(mode){
  syncBadge.classList.remove('live','local');
  if (mode === 'live'){ syncBadge.classList.add('live'); syncBadgeText.textContent = '실시간 동기화 중(구글 시트) · 약 9초마다 갱신'; }
  else if (mode === 'local'){ syncBadge.classList.add('local'); syncBadgeText.textContent = '이 브라우저에서만 저장됨 (새로고침 시 사라짐)'; }
  else { syncBadgeText.textContent = '연결 확인 중…'; }
}
setSyncBadge(null);

function ensurePin(forceAsk){
  if (!sessionPin || forceAsk){
    const input = window.prompt('입력·수정·삭제를 위한 비밀번호(PIN)를 입력하세요');
    sessionPin = (input || '').trim();
  }
  return sessionPin;
}

async function fetchRecordsFromSheet(isFirstLoad){
  if (!GAS_WEB_APP_URL){ setSyncBadge('local'); return; }
  try{
    const res = await fetch(GAS_WEB_APP_URL, {method:'GET'});
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error('bad response');
    usingSheetSync = true;
    setSyncBadge('live');
    records = (data.records || []).map(r => ({...r, date: normDate(r.date), batch: (r.batch==null?'':String(r.batch)), qty: Number(r.qty)||0}));
    renderDashboard();
    renderDetail();
  } catch(e){
    console.error('sheet fetch error', e);
    if (isFirstLoad) setSyncBadge('local');
    /* 이미 동기화 중이었다면 일시적 오류로 보고 배지는 유지하고 다음 폴링에서 재시도 */
  }
}

async function postToSheet(payload){
  const pin = ensurePin(false);
  if (!pin){
    throw {code:'no_pin', message:'비밀번호가 입력되지 않아 저장을 취소했습니다.'};
  }
  const res = await fetch(GAS_WEB_APP_URL, {
    method:'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({...payload, pin}),
  });
  const data = await res.json();
  if (!data || data.ok !== true){
    if (data && data.error === 'invalid_pin'){
      sessionPin = '';
      throw {code:'invalid_pin', message:'비밀번호가 올바르지 않습니다. 다시 시도해주세요.'};
    }
    throw {code:'save_failed', message:'저장에 실패했습니다. 다시 시도해주세요.'};
  }
  return data;
}

function initDb(){
  if (!GAS_WEB_APP_URL){ setSyncBadge('local'); return; }
  fetchRecordsFromSheet(true);
  setInterval(() => fetchRecordsFromSheet(false), SYNC_POLL_MS);
}

document.getElementById('recordForm').addEventListener('submit', async (evt) => {
  evt.preventDefault();
  formMsg.textContent = '';
  formMsg.className = 'form-msg';

  const item = fItem.value.trim();
  const batch = fBatch.value.trim();
  const qty = Number(fQty.value);
  if (!item || !batch || !qty || qty <= 0){
    formMsg.textContent = '품목, 날짜, 수량을 확인해주세요.';
    formMsg.className = 'form-msg err';
    return;
  }
  if (formType === '사용' && !fLoc.value){
    formMsg.textContent = '사용처를 선택해주세요.';
    formMsg.className = 'form-msg err';
    return;
  }

  const rec = {
    material: detailMaterial,
    date: fDate.value || localYMD(new Date()),
    type: formType,
    item,
    code: fCode.value.trim(),
    batch,
    loc: formType === '사용' ? fLoc.value : '-',
    qty,
  };

  const isEdit = !!editingId;
  fSubmit.disabled = true;
  fSubmit.textContent = isEdit ? '수정 저장 중…' : '저장 중…';

  try{
    if (isEdit){
      if (usingSheetSync){
        await postToSheet({action:'set', record: {...rec, id: editingId}});
        await fetchRecordsFromSheet(false);
      } else {
        const idx = records.findIndex(r => r.id === editingId);
        if (idx >= 0) records[idx] = {...rec, id: editingId};
        renderDashboard();
        renderDetail();
      }
      lastNewRecordId = editingId;
      formMsg.textContent = '수정되었습니다.';
    } else if (usingSheetSync){
      const result = await postToSheet({action:'add', record: rec});
      lastNewRecordId = result.id;
      await fetchRecordsFromSheet(false);
      formMsg.textContent = '저장되었습니다.';
    } else {
      rec.id = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
      records.push(rec);
      lastNewRecordId = rec.id;
      renderDashboard();
      renderDetail();
      formMsg.textContent = '저장되었습니다.';
    }
    formMsg.className = 'form-msg ok';
    resetFormToAdd();
    fItem.focus();
  } catch(e){
    console.error(e);
    formMsg.textContent = (e && e.message) ? e.message : ((isEdit ? '수정' : '저장') + '에 실패했습니다. 다시 시도해주세요.');
    formMsg.className = 'form-msg err';
  } finally {
    fSubmit.disabled = false;
    fSubmit.textContent = editingId ? '수정 저장' : '저장';
  }
});

function exportRecordsSheetData(material){
  const d = deriveMaterialData(material);
  const withStock = computeRunningStock(d.recs)
    .slice()
    .sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)));
  const dateCol = material === 'bean' ? '제조일자' : '소비기한';
  const unit = unitOf(material);
  const header = ['날짜','구분','품목','품목코드', dateCol, '사용처', `수량(${unit})`, `기록후 재고(${unit})`];
  const rows = withStock.map(r => [
    r.date, r.type, r.item, r.code||'', r.batch,
    (r.loc && r.loc !== '-') ? r.loc : '',
    r.qty, r.stockAfter,
  ]);
  return [header, ...rows];
}
function exportStockSheetData(material, hideZero){
  const d = deriveMaterialData(material);
  const dateCol = material === 'bean' ? '제조일자' : '소비기한';

    .map(r => [r.code||'', r.item, r.batch, r.in, r.used, r.remain]);
  return [header, ...rows];
}
function exportStockByCodeSheetData(material){
  const d = deriveMaterialData(material);
  const unit = unitOf(material);
  const header = ['품목코드','품목', `총입고량(${unit})`, `총사용량(${unit})`, `총잔여재고(${unit})`];
  const rows = d.stock_by_code.map(g => [g.code||'', g.item, g.in, g.used, g.remain]);

}
function exportItemSummarySheetData(material){
  const d = deriveMaterialData(material);

/* 지금 화면에 보이는 목록(검색어·정렬·재고 필터 적용 상태) 그대로 뽑아내는 1장짜리 내보내기 */
function exportCurrentRecordsView(){
  const d = deriveMaterialData(detailMaterial);
  const withStock = computeRunningStock(d.recs);
  const filtered = withStock.filter(r => !searchTerm || r.item.toLowerCase().includes(searchTerm));
  const dateCol = detailMaterial === 'bean' ? '제조일자' : '소비기한';
  const unit = unitOf(detailMaterial);
  const header = ['날짜','구분','품목','품목코드', dateCol, '사용처', `수량(${unit})`, `기록후 재고(${unit})`];
  const rows = filtered.slice().reverse().map(r => [
    r.date, r.type, r.item, r.code||'', r.batch,
    (r.loc && r.loc !== '-') ? r.loc : '',
    r.qty, r.stockAfter,
  ]);
  return [header, ...rows];
}
function exportCurrentStockView(){
  const d = deriveMaterialData(detailMaterial);
  let filtered = d.stock_rows.filter(r => !searchTerm || r.item.toLowerCase().includes(searchTerm));
  if (stockHideZero) filtered = filtered.filter(r => (r.remain||0) > 0);
  if (stockSortDir){
    filtered = [...filtered].sort((a,b) => {
      const cmp = (a.batch||'').localeCompare(b.batch||'');
      return stockSortDir === 'asc' ? cmp : -cmp;
    });
  }
  const dateCol = detailMaterial === 'bean' ? '제조일자' : '소비기한';
  const unit = unitOf(detailMaterial);
  const header = ['품목코드','품목', dateCol, `입고량(${unit})`, `사용량(${unit})`, `잔여재고(${unit})`];
  const rows = filtered.map(r => [r.code||'', r.item, r.batch, r.in, r.used, r.remain]);
  return [header, ...rows];
}
async function downloadCurrentView(){
  const btn = document.getElementById('btnExportView');
  try{
    if (typeof XLSX === 'undefined'){
      window.alert('엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    if (activeSubtab === 'summary') return; /* 요약 화면에서는 버튼이 숨겨져 있음 */
    const matLabel = detailMaterial === 'bean' ? '원두' : '2차가공품';
    let aoa, sheetLabel;
    if (activeSubtab === 'stock'){
      aoa = exportCurrentStockView();
      sheetLabel = stockHideZero ? '잔여재고(재고있음)' : '잔여재고(전체)';
    } else {
      aoa = exportCurrentRecordsView();
      sheetLabel = '입출고기록';
    }
    if (aoa.length <= 1){
      window.alert('다운로드할 데이터가 없습니다. 검색어나 필터를 확인해주세요.');
      return;
    }
    let downloadsApi = null;
    if (window.claude && typeof window.claude.use === 'function'){
      try { downloadsApi = await window.claude.use('downloads'); } catch(e){ downloadsApi = null; }
    }
    btn.disabled = true;
    const wb = XLSX.utils.book_new();
    const sheet = XLSX.utils.aoa_to_sheet(aoa);
    sheet['!cols'] = autoFitCols(aoa);
    XLSX.utils.book_append_sheet(wb, sheet, `${matLabel}_${sheetLabel}`.slice(0,31));
    const today = localYMD(new Date()).replace(/-/g,'');
    const searchSuffix = searchTerm ? `_검색(${searchTerm})` : '';
    const filename = `${matLabel}_${sheetLabel}${searchSuffix}_${today}.xlsx`;
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    if (downloadsApi){
      await downloadsApi.save({filename, data: blob});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  } catch(e){
    if (e && e.code === 'declined'){
      /* 사용자가 저장을 취소함 — 별도 안내 없음 */
    } else if (e && e.code){
      console.error('download error', e);
      window.alert('다운로드에 실패했습니다: ' + (e.message || e.code));
    } else {
      console.error(e);
      window.alert('엑셀 파일을 만드는 중 오류가 발생했습니다. 다시 시도해주세요.');
    }
  } finally {
    btn.disabled = false;
  }
}

function autoFitCols(aoa){
  const widths = [];
  aoa.forEach(row => {
    row.forEach((cell, i) => {
      const len = String(cell==null?'':cell).length;
      widths[i] = Math.max(widths[i]||8, Math.min(len+2, 40));
    });
  });
  return widths.map(w => ({wch:w}));
}

/* ---------------- EXCEL IMPORT (엑셀 → 구글 시트) ---------------- */
/* 「엑셀 다운로드」로 받은 파일의 입출고기록 시트를 읽어, 구글 시트에 아직 없는
   기록만 골라 하나씩 추가합니다. 같은 기록(날짜·구분·품목·제조일자·사용처·수량이
   모두 같은 것)은 이미 있는 개수만큼 건너뛰므로 여러 번 올려도 중복되지 않습니다. */
function cellToYMD(v){
  if (v instanceof Date) return localYMD(v);
  if (typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Math.round((v - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  return normDate(v);
}
function recKey(r){
  return [r.material, r.date, r.type, String(r.item||'').trim(), String(r.batch||'').trim(),
          (r.loc && r.loc !== '-') ? String(r.loc).trim() : '-', Number(r.qty)||0].join('|');
}
function parseImportWorkbook(wb){
  const out = [];
  const plan = [['bean','원두_입출고기록'], ['capsule','2차가공품_입출고기록']];
  plan.forEach(([material, name]) => {
    const ws = wb.Sheets[name];
    if (!ws) return;
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    rows.slice(1).forEach(row => {
      const [date, type, item, code, batch, loc, qty] = row;
      if (!item || (type !== '입고' && type !== '사용')) return;
      out.push({
        material, date: cellToYMD(date), type, item: String(item).trim(),
        code: String(code||'').trim(), batch: String(batch||'').trim(),
        loc: type === '사용' ? (String(loc||'').trim() || '-') : '-',
        qty: Number(qty)||0,
      });
    });
  });
  return out;
}
const btnImport = document.getElementById('btnImport');
const importFile = document.getElementById('importFile');
btnImport.addEventListener('click', () => {
  if (!usingSheetSync){
    window.alert('구글 시트에 연결된 상태에서만 가져올 수 있습니다. 잠시 후 다시 시도해주세요.');
    return;
  }
  importFile.value = '';
  importFile.click();
});
importFile.addEventListener('change', async () => {
  const file = importFile.files && importFile.files[0];
  if (!file) return;
  const label = btnImport.innerHTML;
  try{
    if (typeof XLSX === 'undefined'){ window.alert('엑셀 라이브러리를 불러오지 못했습니다.'); return; }
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const incoming = parseImportWorkbook(wb);
    if (!incoming.length){
      window.alert('파일에서 입출고 기록을 찾지 못했습니다.\n이 페이지의 「엑셀 다운로드」로 받은 파일인지 확인해주세요.');
      return;
    }
    await fetchRecordsFromSheet(false);
    const have = new Map();
    records.forEach(r => { const k = recKey(r); have.set(k, (have.get(k)||0) + 1); });
    const toAdd = [];
    incoming.forEach(r => {
      const k = recKey(r);
      const n = have.get(k) || 0;
      if (n > 0) have.set(k, n - 1); else toAdd.push(r);
    });
    if (!toAdd.length){
      window.alert(`파일의 기록 ${incoming.length}건이 모두 이미 구글 시트에 있습니다. 추가할 내용이 없어요.`);
      return;
    }
    const nb = toAdd.filter(r=>r.material==='bean').length, nc = toAdd.length - nb;
    if (!window.confirm(`파일 기록 ${incoming.length}건 중 구글 시트에 없는 ${toAdd.length}건을 추가할까요?\n(원두 ${nb}건 · 2차가공품 ${nc}건)\n\n추가 중에는 창을 닫지 마세요.`)) return;
    if (!ensurePin(false)) return;
    btnImport.disabled = true;
    let done = 0;
    for (const r of toAdd){
      btnImport.textContent = `가져오는 중… ${done}/${toAdd.length}`;
      await postToSheet({action:'add', record: r});
      done++;
    }
    await fetchRecordsFromSheet(false);
    window.alert(`${done}건을 추가했습니다.`);
  } catch(e){
    console.error(e);
    window.alert('가져오기 중 오류가 발생했습니다: ' + ((e && e.message) || '알 수 없는 오류') + '\n\n다시 올리면 이미 들어간 기록은 건너뛰고 나머지만 추가합니다.');
    fetchRecordsFromSheet(false);
  } finally {
    btnImport.disabled = false;
    btnImport.innerHTML = label;
  }
});
